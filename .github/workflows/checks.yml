name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: make check
      - run: make race
      - run: make build
      - name: Verify generated assembly
        run: go generate ./tensor && git diff --exit-code
      - name: Cross-compile portable CLIs
        run: |
          for target in linux/arm64 darwin/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 go build -o /tmp/layago-${target%/*} ./cmd/layago
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 go build -o /tmp/laya-train-${target%/*} ./cmd/laya-train
          done
